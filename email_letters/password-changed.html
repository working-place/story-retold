<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пароль изменён — Digital Memory</title>
    <style type="text/css">
        @media only screen and (max-width: 480px) {
            table[class="container"] {
                width: 100% !important;
            }

            table[class="button-table"] {
                width: 100% !important;
            }

            td[class="content-padding"] {
                padding-left: 15px !important;
                padding-right: 15px !important;
            }
        }
    </style>
</head>
<body style="margin: 0; padding: 0; background-color: #FFFFFF; font-family: Arial, sans-serif;">

<!-- Основной контейнер -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#FFFFFF" align="center" style="background-color: #FFFFFF;">
    <tr>
        <td align="center" style="padding-top: 20px; padding-bottom: 20px;">

            <!-- Внутренний контейнер -->
            <table class="container" role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#FDF7E9" style="max-width: 600px; width: 100%; border-collapse: collapse; background-color: #FDF7E9;">

                <!-- Полноширинная шапка -->
                <tr>
                    <td align="center" style="padding: 0; background-color: #FDF7E9;">
                        <img src="https://digital-memory.ru/emailphoto_1.png" width="600" alt="Digital Memory" style="display: block; width: 100%; max-width: 100%; height: auto; border: 0;" />
                    </td>
                </tr>

                <!-- Контент -->
                <tr>
                    <td class="content-padding" style="padding: 20px 40px 30px 40px; background-color: #FDF7E9;">
                        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                            <tr>
                                <td style="font-family: Arial, Helvetica, sans-serif; font-size: 16px; line-height: 1.6; color: #333333;">

                                    <p style="margin: 0 0 16px 0;">Здравствуйте!</p>

                                    <p style="margin: 0 0 24px 0;">Пароль для вашей учётной записи был успешно изменён.</p>

                                    <p style="margin: 0;">Если вы не выполняли данное действие, свяжитесь с администрацией платформы.</p>

                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

            </table>

        </td>
    </tr>
</table>

</body>
</html>
