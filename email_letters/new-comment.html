<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новый комментарий — Digital Memory</title>
</head>
<body style="margin: 0; padding: 0; background-color: #F2E7D1; font-family: Arial, sans-serif;">
    <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" style="background-color: #F2E7D1;">
        <tr>
            <td align="center" style="padding: 20px 0;">
                <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="600" style="width: 600px; background-color: #F2E7D1; position: relative;">
                    <tr>
                        <td style="position: relative; background-color: #F2E7D1; overflow: hidden;">
                            <div style="position: absolute; top: 0px; left: 0px; z-index: 1;">
                                <img src="https://digital-memory.ru/email-bg-1.png" alt="" style="display: block; border: 0;" />
                            </div>
                            <div style="position: absolute; top: 100px; right: 10px; z-index: 1;">
                                <img src="https://digital-memory.ru/email-bg-2.png" alt="" style="display: block; border: 0;" />
                            </div>
                            <div style="position: absolute; top: -45.32px; left: -51px; width: 100%; transform: rotate(7.01deg); -webkit-transform: rotate(7.01deg); opacity: 1; z-index: 1;">
                                <img src="https://digital-memory.ru/email-bg-3.png" alt="" style="width: 100%; display: block; border: 0;" />
                            </div>

                            <!-- Спейсер для отступа текста от верха (698px) -->
                            <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%">
                                <tr>
                                    <td height="698" style="height: 698px; font-size: 0; line-height: 0;">&nbsp;</td>
                                </tr>
                            </table>
                            <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" style="padding: 0 31px; position: relative; z-index: 2;">
                                <tr>
                                    <td style="font-family: Arial, sans-serif; font-size: 16px; line-height: 24px; color: #333333;">
                                        
                                        <p style="margin: 0 0 16px 0;">Здравствуйте!</p>
                                        
                                        <p style="margin: 0 0 24px 0;">Пользователь <strong>{{user_name}}</strong> оставил комментарий к материалу <strong>«{{material_title}}»</strong>:</p>
                                        <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" style="margin-bottom: 24px;">
                                            <tr>
                                                <td style="background-color: #ffffff; border-radius: 12px; border-left: 4px solid #534035; padding: 16px 20px; font-family: Arial, sans-serif; font-size: 16px; line-height: 24px; font-style: italic; color: #333333;">
                                                    {{comment_text}}
                                                </td>
                                            </tr>
                                        </table>

                                        <p style="margin: 0 0 24px 0;">Чтобы ответить или посмотреть обсуждение, перейдите к материалу:</p>
                                        <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" style="margin-bottom: 24px;">
                                            <tr>
                                                <td align="center">
                                                    <a href="{{material_link}}" target="_blank" style="display: block; box-sizing: border-box; width: 538px; height: 66px; line-height: 42px; background-color: #534035; color: #ffffff; font-family: Arial, sans-serif; font-size: 18px; font-weight: bold; text-align: center; text-decoration: none; border-radius: 20px; padding: 12px 24px;">
                                                        Перейти к материалу
                                                    </a>
                                                </td>
                                            </tr>
                                        </table>

                                        <p style="margin: 0; font-size: 14px; line-height: 20px; color: #666666;">
                                            Это автоматическое уведомление — отвечать на письмо не нужно.
                                        </p>
                                        
                                    </td>
                                </tr>
                            </table>
                            <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%">
                                <tr>
                                    <td height="40" style="height: 40px; font-size: 0; line-height: 0;">&nbsp;</td>
                                </tr>
                            </table>
                            
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
